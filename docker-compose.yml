services:
  osrm-backend:
    image: osrm/osrm-backend:latest
    container_name: kerno-osrm-backend
    ports:
      - "5003:5000"
    volumes:
      - ./data:/data
      # Monta el perfil personalizado de Bolivia dentro del contenedor
      - ./options/bolivia.lua:/opt/bolivia.lua
    entrypoint: /bin/bash
    command: >
      -c "
      if [ ! -f /data/bolivia-latest.osrm ]; then
        echo 'Procesando datos de Bolivia con perfil personalizado...';
        osrm-extract -p /opt/bolivia.lua /data/bolivia-latest.osm.pbf &&
        osrm-partition /data/bolivia-latest.osrm &&
        osrm-customize /data/bolivia-latest.osrm &&
        echo 'Procesamiento completado.';
      fi;
      echo 'Iniciando servidor OSRM en puerto 5000...';
      osrm-routed --algorithm mld /data/bolivia-latest.osrm --max-table-size 8000
      "
    restart: unless-stopped
